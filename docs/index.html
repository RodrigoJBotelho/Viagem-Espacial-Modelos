<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelos de viagem espacial: visualizador de resultados</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1b1b1f; --muted: #5b5b66; --grid: #dcdce3;
    --panel: #f5f5f8; --accent: #0072B2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --fg: #ececf1; --muted: #a0a0ad; --grid: #34343d;
      --panel: #202027; --accent: #56B4E9;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--fg); line-height: 1.5; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
              background: var(--panel); padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  button, label.file { font: inherit; padding: 6px 12px; border-radius: 6px; cursor: pointer;
              border: 1px solid var(--grid); background: var(--bg); color: var(--fg); }
  button:hover, label.file:hover { border-color: var(--accent); }
  button:focus-visible, label.file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=file] { position: absolute; opacity: 0; width: 1px; height: 1px; }
  #msg { color: var(--muted); font-size: .9rem; min-height: 1.4em; margin: 0 0 8px; }
  #title { font-weight: 600; margin: 0 0 6px; }
  canvas { width: 100%; height: 380px; display: block; background: var(--bg);
           border: 1px solid var(--grid); border-radius: 8px; }
  ul#legend { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px 18px; }
  ul#legend li { display: flex; align-items: center; gap: 6px; font-size: .9rem; }
  ul#legend svg { width: 28px; height: 10px; }
  details { margin-top: 16px; }
  table { border-collapse: collapse; font-size: .85rem; display: block; overflow-x: auto; }
  th, td { padding: 3px 10px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>Modelos de viagem espacial</h1>
  <p class="sub">Visualize os arquivos CSV gerados por <code>radiacao</code> e <code>calor1d</code>.
     Não é preciso instalar nada.</p>

  <div class="controls">
    <strong>Exemplos:</strong>
    <button data-ex="exemplos/radiacao_espessura.csv">Dose x espessura</button>
    <button data-ex="exemplos/radiacao_duracao.csv">Dose x duração</button>
    <button data-ex="exemplos/reentrada_perfil.csv">Perfil de temperatura</button>
    <button data-ex="exemplos/reentrada_historico.csv">Temperatura na superfície</button>
    <label class="file">Abrir meu CSV<input type="file" id="arquivo" accept=".csv,text/csv"></label>
  </div>

  <p id="msg" role="status" aria-live="polite">Escolha um exemplo ou abra um CSV (primeira coluna = eixo X).</p>
  <p id="title"></p>
  <canvas id="grafico" role="img" aria-label="Gráfico dos dados carregados"></canvas>
  <ul id="legend"></ul>

  <details>
    <summary>Ver tabela (primeiras linhas)</summary>
    <table id="tabela"></table>
  </details>
</main>

<script>
(function () {
  'use strict';
  var CORES = ['#0072B2', '#D55E00', '#009E73', '#CC79A7', '#E69F00', '#56B4E9'];
  var TRACOS = [[], [8, 4], [2, 3], [10, 3, 2, 3], [], [6, 2]];
  var canvas = document.getElementById('grafico');
  var ctx = canvas.getContext('2d');
  var estado = null;

  function css(nome) {
    return getComputedStyle(document.documentElement).getPropertyValue(nome).trim();
  }

  function lerCSV(texto) {
    var linhas = texto.replace(/\r/g, '').split('\n').filter(function (l) { return l.trim() !== ''; });
    if (linhas.length < 2) throw new Error('CSV vazio ou sem dados.');
    var cab = linhas[0].split(',').map(function (s) { return s.trim(); });
    var dados = linhas.slice(1).map(function (l) {
      return l.split(',').map(function (s) { return parseFloat(s); });
    });
    return { cab: cab, dados: dados };
  }

  function ticks(min, max, n) {
    if (min === max) { min -= 1; max += 1; }
    var bruto = (max - min) / n;
    var mag = Math.pow(10, Math.floor(Math.log10(bruto)));
    var norm = bruto / mag;
    var passo = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    var ini = Math.ceil(min / passo) * passo, out = [];
    for (var v = ini; v <= max + passo * 1e-9; v += passo) out.push(+v.toPrecision(12));
    return { valores: out, passo: passo };
  }

  function fmt(v, passo) {
    var casas = Math.max(0, -Math.floor(Math.log10(passo)));
    if (Math.abs(v) >= 1e5 || (v !== 0 && Math.abs(v) < 1e-3)) return v.toExponential(1);
    return v.toFixed(Math.min(casas, 6));
  }

  function desenhar() {
    if (!estado) return;
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var cab = estado.cab, dados = estado.dados;
    var ml = 64, mr = 16, mt = 12, mb = 44;
    var xs = dados.map(function (r) { return r[0]; });
    var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs);
    var ymin = Infinity, ymax = -Infinity;
    for (var i = 0; i < dados.length; i++)
      for (var j = 1; j < cab.length; j++) {
        var y = dados[i][j];
        if (isFinite(y) && Math.abs(y) < 1e12) { if (y < ymin) ymin = y; if (y > ymax) ymax = y; }
      }
    if (!isFinite(ymin)) { ymin = 0; ymax = 1; }
    var pad = (ymax - ymin) * 0.05 || 1; ymin -= pad; ymax += pad;
    var tx = ticks(xmin, xmax, 6), ty = ticks(ymin, ymax, 6);
    function X(v) { return ml + (v - xmin) / ((xmax - xmin) || 1) * (w - ml - mr); }
    function Y(v) { return h - mb - (v - ymin) / ((ymax - ymin) || 1) * (h - mt - mb); }

    var grid = css('--grid'), fg = css('--fg'), muted = css('--muted');
    ctx.font = '12px system-ui, sans-serif';
    ctx.lineWidth = 1; ctx.strokeStyle = grid; ctx.fillStyle = muted;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ty.valores.forEach(function (v) {
      ctx.beginPath(); ctx.moveTo(ml, Y(v)); ctx.lineTo(w - mr, Y(v)); ctx.stroke();
      ctx.fillText(fmt(v, ty.passo), ml - 6, Y(v));
    });
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    tx.valores.forEach(function (v) {
      ctx.beginPath(); ctx.moveTo(X(v), mt); ctx.lineTo(X(v), h - mb); ctx.stroke();
      ctx.fillText(fmt(v, tx.passo), X(v), h - mb + 6);
    });
    ctx.fillStyle = fg;
    ctx.fillText(cab[0], ml + (w - ml - mr) / 2, h - 18);

    for (var s = 1; s < cab.length; s++) {
      ctx.strokeStyle = CORES[(s - 1) % CORES.length];
      ctx.setLineDash(TRACOS[(s - 1) % TRACOS.length]);
      ctx.lineWidth = 2; ctx.beginPath();
      var aberto = false;
      for (var k = 0; k < dados.length; k++) {
        var yy = dados[k][s];
        if (!isFinite(yy) || Math.abs(yy) > 1e12) { aberto = false; continue; }
        if (!aberto) { ctx.moveTo(X(dados[k][0]), Y(yy)); aberto = true; }
        else ctx.lineTo(X(dados[k][0]), Y(yy));
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  function legenda() {
    var ul = document.getElementById('legend');
    ul.innerHTML = '';
    for (var s = 1; s < estado.cab.length; s++) {
      var li = document.createElement('li');
      var cor = CORES[(s - 1) % CORES.length];
      var tr = TRACOS[(s - 1) % TRACOS.length].join(' ');
      li.innerHTML = '<svg viewBox="0 0 28 10" aria-hidden="true"><line x1="0" y1="5" x2="28" y2="5" ' +
        'stroke="' + cor + '" stroke-width="2.5" stroke-dasharray="' + tr + '"/></svg>';
      var span = document.createElement('span');
      span.textContent = estado.cab[s];
      li.appendChild(span);
      ul.appendChild(li);
    }
  }

  function tabela() {
    var t = document.getElementById('tabela');
    t.innerHTML = '';
    var thead = document.createElement('tr');
    estado.cab.forEach(function (c) { var th = document.createElement('th'); th.textContent = c; thead.appendChild(th); });
    t.appendChild(thead);
    estado.dados.slice(0, 20).forEach(function (r) {
      var tr = document.createElement('tr');
      r.forEach(function (v) {
        var td = document.createElement('td');
        td.textContent = isFinite(v) ? (+v.toPrecision(6)).toString() : '—';
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
  }

  function mostrar(texto, nome) {
    try {
      estado = lerCSV(texto);
      document.getElementById('title').textContent = nome;
      document.getElementById('msg').textContent = estado.dados.length + ' linhas, ' +
        (estado.cab.length - 1) + ' série(s).';
      document.getElementById('grafico').setAttribute('aria-label',
        'Gráfico: ' + estado.cab.slice(1).join(', ') + ' em função de ' + estado.cab[0]);
      legenda(); tabela(); desenhar();
    } catch (e) {
      document.getElementById('msg').textContent = 'Erro: ' + e.message;
    }
  }

  document.querySelectorAll('button[data-ex]').forEach(function (b) {
    b.addEventListener('click', function () {
      var url = b.getAttribute('data-ex');
      fetch(url).then(function (r) {
        if (!r.ok) throw new Error('não foi possível carregar ' + url);
        return r.text();
      }).then(function (t) { mostrar(t, b.textContent); })
        .catch(function () {
          document.getElementById('msg').textContent =
            'Os exemplos só carregam quando a página é servida (GitHub Pages). ' +
            'Abrindo o arquivo direto no computador, use "Abrir meu CSV" e escolha um arquivo da pasta docs/exemplos.';
        });
    });
  });

  document.getElementById('arquivo').addEventListener('change', function (ev) {
    var f = ev.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { mostrar(String(rd.result), f.name); };
    rd.readAsText(f);
  });

  window.addEventListener('resize', desenhar);
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', desenhar);
  }
})();
</script>
</body>
</html>
